name: Refrescar precios

# Respaldo del refresco de precios. El que corre cada 30 minutos es el de
# Supabase (pg_cron, ver supabase/migrations/0011): este workflow se pensó
# para eso, pero GitHub atrasa o salta las ejecuciones programadas cuando
# tiene carga y en la práctica corría cada 3 a 6 horas. Queda como red de
# seguridad y para lanzarlo a mano (Actions → Refrescar precios → Run).
#
# Requiere el secreto CRON_SECRET (Settings → Secrets and variables →
# Actions), con el mismo valor que la variable de Vercel. La URL se puede
# cambiar con la variable SITE_URL cuando el sitio tenga dominio propio.

on:
  schedule:
    # Cada 2 horas: es solo un respaldo de pg_cron, que corre cada 30
    # minutos. Minuto 23 porque en punto y a la media son los que más atrasa.
    - cron: '23 */2 * * *'
  workflow_dispatch:

# Si una corrida se atrasa, que no se monte con la siguiente.
concurrency:
  group: refresh-prices
  cancel-in-progress: false

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Llamar al endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://comparatech-web.vercel.app' }}
        run: |
          # Sin el secreto no hay nada que hacer, pero tampoco es una falla:
          # así no llega un correo de error cada 2 horas mientras no se
          # configura. El aviso queda en la pestaña Actions.
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::Falta el secreto CRON_SECRET en Settings → Secrets and variables → Actions"
            exit 0
          fi
          # --retry cubre caídas pasajeras (502/503/504 o timeout): sin esto,
          # un token de ML que no responde una vez dispara un correo de fallo.
          # Sin -f a propósito: así se guarda y muestra la respuesta aunque
          # sea un 500, que trae el resumen con el motivo.
          code=$(curl -sS -o out.json -w '%{http_code}' --max-time 90 --retry 2 --retry-delay 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/refresh-prices") || code=000
          cat out.json 2>/dev/null || true
          echo
          # El endpoint responde 500 con ok:false si hubo escrituras fallidas
          # o si más de la mitad de los productos quedó sin revisar.
          if [ "$code" != "200" ]; then
            echo "::error::El refresco de precios respondió HTTP $code"
            exit 1
          fi
          if ! jq -e '.ok == true' out.json > /dev/null; then
            echo "::error::El refresco de precios no terminó bien (ok distinto de true)"
            exit 1
          fi
